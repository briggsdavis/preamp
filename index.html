<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/images/preamplogo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Pre Amp Coffee Studio, a coffee-and-vinyl listening bar in Squirrel Hill, Pittsburgh. Specialty espresso, pourovers, and good records, all day."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Churchward is our primary display face (used by every heading). It's
         referenced deep in the CSS, so preload it to pull the request forward
         and let it swap in early - otherwise headings reflow late (CLS). -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/churchward-design-bold.woff2"
      crossorigin
    />
    <!-- Load Google Fonts without blocking first paint. font-display:swap
         already renders text in the fallback face until the webfont arrives. -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <!-- Preload the hero wordmark - the LCP element - at high priority so it
         downloads in parallel with the JS bundle instead of waiting for React
         to mount. The photographic backdrop is preloaded too, but at normal
         priority so it can't out-compete the LCP. -->
    <link
      rel="preload"
      as="image"
      href="/images/heroprimary.png"
      fetchpriority="high"
    />
    <link rel="preload" as="image" href="/images/preampdecor.webp" />
    <title>Pre Amp Coffee Studio · Brews &amp; Beats in Pittsburgh</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
